<title>Radio Stations</title><style>
:root{--bg:#000000;--card:#fff;--ink:#2e211c;--muted:#7d7069;--accent:#6d4434;--line:#e5ddd5;--shadow:0 8px 24px rgba(62,37,29,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1250px;margin:auto;padding:22px 24px}.top{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{margin:0;font-size:30px;letter-spacing:-.04em}.sub{color:var(--muted);margin-top:5px;font-size:14px}.stats{font-size:14px;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}input,select,button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font:inherit;color:var(--ink)}
input{min-width:260px;flex:1}button{cursor:pointer}.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:16px;padding:24px 0 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:82px 1fr;gap:14px;min-height:112px}
.logo{width:82px;height:82px;border-radius:14px;object-fit:contain;background:#f1ece6}.logo.blank{display:grid;place-items:center;font-size:28px;color:#b7aaa1}
.name{font-weight:750;font-size:17px;line-height:1.2;margin:3px 0 7px}.folder{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:7px;margin-top:12px}.actions a,.play{font-size:12px;text-decoration:none;border:1px solid var(--line);padding:7px 9px;border-radius:9px;color:var(--ink);background:#fff}.star{float:right;font-size:18px;color:#c6bbb4}.star.yes{color:#b06d2f}
.empty{text-align:center;color:var(--muted);padding:80px 20px;grid-column:1/-1}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(46,33,28,.95);color:#fff;padding:9px 18px;font-size:13px;display:none;align-items:center;gap:12px;z-index:8}footer audio{height:32px;flex:1}.now{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.wrap{padding:17px 14px}.grid{grid-template-columns:1fr}.controls>*{width:100%}input{min-width:0}}

audio::-webkit-media-controls-current-time-display,
audio::-webkit-media-controls-time-remaining-display {
  display: none !important;
}

</style><script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script></head><body><header><div class="wrap"><div class="top"><div><h1>Radio Stations</h1><div class="sub"></div></div><div class="stats" id="stats"></div></div>

<main class="wrap"><div id="grid" class="grid"></div></main><div id="diag" style="display:none;position:fixed;left:14px;right:14px;bottom:58px;z-index:9;

<button onclick="document.getElementById('diag').style.display='none'"

function explainHlsError(data){
  const code=data.response&&data.response.code ? ` HTTP ${data.response.code}` : '';

  const reason=data.reason ? ` — ${data.reason}` : '';
