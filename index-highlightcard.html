<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <title>Radio Stations</title><link rel="icon" type="image/x-icon" href="images/radio-stations-favicon.ico"><style> :root{--bg:#000000;--card:#C0C0C0;--ink:#2e211c;--muted:#000000;--accent:#808080;--line:#e5ddd5;--shadow:0 8px 24px rgba(62,37,29,.08)} \*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif} header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.64);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)} .wrap{max-width:1250px;margin:auto;padding:22px 24px}.top{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap} h1{color:#ffffff;margin:0;font-size:30px;letter-spacing:-.04em}.sub{color:var(--muted);margin-top:5px;font-size:14px}.stats{font-size:14px;color:#ffffff;} .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}input,select,button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font:inherit;color:var(--ink)} input{min-width:260px;flex:1}button{cursor:pointer}.active{background:var(--accent);color:#fff;border-color:var(--accent)} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:16px;padding:24px 0 80px} .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:82px 1fr;gap:14px;min-height:112px}
 .card.playing-card{
   outline:3px solid #c56a16;
   outline-offset:2px;
 } .logo{width:82px;height:82px;border-radius:14px;object-fit:contain;background:#f1ece6}.logo.blank{display:grid;place-items:center;font-size:28px;color:#b7aaa1} .name{font-weight:750;font-size:17px;line-height:1.2;margin:3px 0 7px}.folder{font-size:12px;color:var(--muted);white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;overflow-wrap:anywhere} .card>div:last-child{position:relative;padding-bottom:42px}.actions{display:flex;gap:7px;margin-top:12px;position:absolute;left:0;bottom:0}.actions a,.play{font-size:12px;text-decoration:none;border:1px solid var(--line);padding:7px 9px;border-radius:9px;color:var(--ink);background:#fff}.star{float:right;font-size:18px;color:#c6bbb4}.star.yes{color:#b06d2f} .empty{text-align:center;color:var(--muted);padding:80px 20px;grid-column:1/-1} footer{position:fixed;bottom:0;left:0;right:0;background:rgba(128,128,128,.95);color:#fff;padding:9px 18px;font-size:13px;display:none;align-items:center;gap:12px;z-index:8}footer audio{height:32px;flex:1}.now{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} @media(max-width:600px){.wrap{padding:17px 14px}.grid{grid-template-columns:1fr}.controls>\*{width:100%}input{min-width:0}}  audio::-webkit-media-controls-current-time-display, audio::-webkit-media-controls-time-remaining-display {   display: none !important; }   /\* All / Favorites segmented control \*/ .segmented{   display:inline-flex;   padding:3px;   background:#808080;   border-radius:13px;   gap:0; } .segmented button{   border:0;   background:transparent;   color:#fff;   padding:12px 18px;   min-height:44px;   font-size:14px;   cursor:pointer;   border-radius:10px;   transition:background .15s ease,color .15s ease; } .segmented button.active{   background:#fff;   color:#111; } .segmented button:focus-visible{   outline:2px solid #fff;   outline-offset:2px; }  .radio-title-image{   display:block;   width:360px;   max-width:100%;   height:auto; } .top{   align-items:end; }  .type-segmented{white-space:nowrap} @media(max-width:760px){   .controls{flex-wrap:wrap} }  #favs.active .favorite-toggle-star{color:#c56a16} </style><script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script></head><body><header><div class="wrap"><div class="top"><div><img class="radio-title-image" src="images/radio-stations-title.png" alt="Radio Stations"></div><div class="stats" id="stats"></div></div> <div class="controls"><select id="genre"><option value="">All Genres</option></select><input id="search" placeholder="Search stations…"><div class="segmented type-segmented"><button id="typeAll" class="active">All</button><button id="typeInternet">Internet</button><button id="typeOnAir">On Air</button></div><div class="segmented"><button id="all">All</button><button id="favs" class="active"><span class="favorite-toggle-star">★</span> Favorites</button></div></div></div></header> <main class="wrap"><div id="grid" class="grid"></div></main><div id="diag" style="display:none;position:fixed;left:14px;right:14px;bottom:58px;z-index:9; background:#fff8ef;border:1px solid #d9b88f;border-radius:12px;padding:10px 12px; font-size:12px;line-height:1.35;color:#5b3a2b;box-shadow:0 8px 24px rgba(0,0,0,.12)"> <span id="diagText"></span> <button onclick="document.getElementById('diag').style.display='none'" style="float:right;padding:2px 7px;border-radius:7px">×</button></div> <footer id="player"><div class="now" id="now"></div><audio id="audio" controls></audio></footer> <script> let stations=[]; let favOnly=true,typeFilter='all'; const grid=document.getElementById('grid'),search=document.getElementById('search'),genre=document.getElementById('genre'),allBtn=document.getElementById('all'),favBtn=document.getElementById('favs'),typeAllBtn=document.getElementById('typeAll'),typeInternetBtn=document.getElementById('typeInternet'),typeOnAirBtn=document.getElementById('typeOnAir'),stats=document.getElementById('stats'),player=document.getElementById('player'),audio=document.getElementById('audio'),now=document.getElementById('now');  const genreOrder=['80s','90s','Alternative','Rock','Grunge','Classic Rock','Country','Hip-Hop/Rap','Top 40','Dance'];  function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}  function stationGenreRank(s){   const gs=s.genres||[];   for(let r=0;r<genreOrder.length;r++) if(gs.includes(genreOrder[r])) return r;   return genreOrder.length; }  function populateGenres(){   genre.innerHTML='<option value="">All Genres</option>';   [...new Set(stations.flatMap(s=>Array.isArray(s.genres)?s.genres:[]))]     .sort((a,b)=>a.localeCompare(b))     .forEach(g=>{       const o=document.createElement('option');       o.value=g;       o.textContent=g;       genre.appendChild(o);     }); }  function render(){   const q=search.value.trim().toLowerCase(),g=genre.value;   const list=[];   for(let i=0;i<stations.length;i++){     const s=stations[i],gs=Array.isArray(s.genres)?s.genres:[];     if(s.visible!==true)continue;     if(favOnly&&!s.favorite)continue;     if(typeFilter!=='all'&&s.type!==typeFilter)continue;     if(g&&!gs.includes(g))continue;     if(q&&!s.name.toLowerCase().includes(q))continue;     list.push(i);   }   list.sort((a,b)=>stationGenreRank(stations[a])-stationGenreRank(stations[b])||(stations[a].type==='Internet'?0:1)-(stations[b].type==='Internet'?0:1)||stations[a].name.localeCompare(stations[b].name));   stats.textContent=`${list.length} of ${stations.length} stations`;   grid.innerHTML=list.length?list.map(i=>{     const s=stations[i],gs=Array.isArray(s.genres)?s.genres:[];     return `<article class="card" data-station-index="${i}">${s.logo?`<img class="logo" src="${esc(s.logo)}" alt="">`:`<div class="logo blank">♪</div>`}<div><div class="star ${s.favorite?'yes':''}">★</div><div class="name">${esc(s.name)}</div><div class="folder">${esc(gs.join(' • '))}</div><div class="actions">${s.stream?`<button class="play" onclick="playStation(${i})">▶ Play</button>`:''}${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">Website ↗</a>`:''}</div></div></article>`;   }).join(''):`<div class="empty">No stations match your filters.</div>`; }  let hlsPlayer=null; const diag=document.getElementById('diag'),diagText=document.getElementById('diagText'); let diagTimer=null; function hideDiag(){clearTimeout(diagTimer);diagTimer=null;diag.style.display='none';diagText.textContent=''} function stationOffline(stationName){   if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null}   audio.pause();audio.removeAttribute('src');audio.load();hideDiag();clearTimeout(diagTimer);diagTimer=null;   now.style.maxWidth='320px';now.textContent='Offline: '+stationName;audio.style.display='';audio.disabled=true;audio.style.opacity='.45';audio.style.pointerEvents='none';player.style.display='flex'; } function isHlsUrl(url){return /\\.m3u8(?:\\/)?(?:$|[?#])/i.test(url||'')} function resetPlayer(){   if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null}   clearTimeout(diagTimer);diagTimer=null;audio.style.display='';audio.disabled=false;audio.style.opacity='';audio.style.pointerEvents='';now.style.maxWidth='320px';audio.pause();audio.removeAttribute('src');audio.load();hideDiag(); }  audio.addEventListener('error',()=>{const e=audio.error;if(!e)return;const label=now.textContent.replace(/^(Loading|Playing|Manifest loaded):\s\*/,'')||'Station';stationOffline(label)}); audio.addEventListener('playing',()=>hideDiag());  function highlightPlayingCard(i){
   document.querySelectorAll('.card.playing-card').forEach(c=>c.classList.remove('playing-card'));
   const card=document.querySelector('.card[data-station-index="'+i+'"]');
   if(card) card.classList.add('playing-card');
 }
 window.playStation=i=>{   const s=stations[i];if(!s||!s.stream)return;   highlightPlayingCard(i);   resetPlayer();now.textContent='Loading: '+s.name;player.style.display='flex';   const startPlayback=()=>{audio.play().then(()=>{now.textContent='Playing: '+s.name;hideDiag()}).catch(()=>{stationOffline(s.name)})};   if(isHlsUrl(s.stream)){     if(window.Hls&&Hls.isSupported()){       hlsPlayer=new Hls({enableWorker:true});       hlsPlayer.on(Hls.Events.MANIFEST_LOADED,()=>{now.textContent='Manifest loaded: '+s.name});       hlsPlayer.on(Hls.Events.MANIFEST_PARSED,startPlayback);       hlsPlayer.on(Hls.Events.ERROR,(event,data)=>{         if(!data.fatal)return;         now.textContent='Playback failed: '+s.name;         if(data.type===Hls.ErrorTypes.MEDIA_ERROR){try{hlsPlayer.recoverMediaError();return}catch(e){}}         stationOffline(s.name);       });       try{hlsPlayer.loadSource(s.stream);hlsPlayer.attachMedia(audio)}catch(err){stationOffline(s.name)}     }else if(audio.canPlayType('application/vnd.apple.mpegurl')){       audio.src=s.stream;audio.addEventListener('loadedmetadata',startPlayback,{once:true});audio.load();     }else{now.textContent='Playback failed: '+s.name;stationOffline(s.name)}   }else{     audio.src=s.stream;audio.load();startPlayback();   } };  search.addEventListener('input',render); genre.addEventListener('change',render); function setTypeFilter(v){typeFilter=v;typeAllBtn.classList.toggle('active',v==='all');typeInternetBtn.classList.toggle('active',v==='Internet');typeOnAirBtn.classList.toggle('active',v==='On Air');render()} typeAllBtn.onclick=()=>setTypeFilter('all'); typeInternetBtn.onclick=()=>setTypeFilter('Internet'); typeOnAirBtn.onclick=()=>setTypeFilter('On Air'); allBtn.onclick=()=>{favOnly=false;allBtn.classList.add('active');favBtn.classList.remove('active');render()}; favBtn.onclick=()=>{favOnly=true;favBtn.classList.add('active');allBtn.classList.remove('active');render()};  async function loadStations(){   try{     const response=await fetch('stations.json',{cache:'no-store'});     if(!response.ok)throw new Error(`HTTP ${response.status}`);     const data=await response.json();     if(!Array.isArray(data.stations))throw new Error('stations.json does not contain a stations array');     stations=data.stations;     populateGenres();     render();   }catch(err){     console.error('Unable to load stations.json',err);     stats.textContent='Unable to load stations';     grid.innerHTML='<div class="empty">Unable to load stations.json.</div>';   } }  loadStations(); </script></body></html>
