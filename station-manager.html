<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Station Manager</title>
<style>
:root{--bg:#111;--panel:#c0c0c0;--ink:#222;--line:#aaa;--accent:#808080}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#222;border-bottom:1px solid #444}
.wrap{max-width:1500px;margin:auto;padding:18px 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{margin:0;font-size:27px}
.stats{font-size:14px;color:#ccc}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input,select{background:#fff;color:#222}
#search{min-width:280px;flex:1}
button{cursor:pointer;background:#fff;color:#222}
.export{font-weight:700}
main{max-width:1500px;margin:auto;padding:18px 22px 60px}
.table-wrap{overflow:auto;background:var(--panel);border-radius:10px;border:1px solid #888}
table{width:100%;border-collapse:collapse;color:var(--ink);font-size:13px;min-width:1150px}
thead{position:sticky;top:0;background:#ddd;z-index:2}
th,td{border-bottom:1px solid #aaa;padding:7px 8px;text-align:left;vertical-align:middle}
th{font-weight:700;white-space:nowrap}
tbody tr:nth-child(even){background:#d5d5d5}
tbody tr:hover{background:#eee}
.name{font-weight:700;min-width:190px}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:5px}
.cell:focus{background:#fff;border-color:#888;outline:none}
.logo-cell{width:145px;text-align:center}
.logo-cell img{width:36px;height:36px;object-fit:contain;border-radius:5px;background:#eee;display:block;margin:0 auto 5px}
.logo-path{font-size:11px;width:100%;padding:4px}
.bool{font-size:19px;text-align:center;width:75px}
.bool button{border:0;background:transparent;font-size:19px;padding:2px 7px}
.bool button.yes{color:#16833b}
.bool button.no{color:#a33}
.genres{min-width:180px}
.genre-list{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eee;border:1px solid #bbb;font-size:11px}
.edit-icon{border:0;background:transparent;padding:2px 4px;font-size:15px;line-height:1;color:#555}
.edit-icon:hover{color:#111;background:#ddd}
.url{min-width:280px}
.rownum{color:#777;width:45px;text-align:center}
.note{color:#bbb;font-size:12px;margin-top:10px}
.empty{padding:60px;text-align:center;color:#666}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal-backdrop.open{display:flex}
.modal{background:#ddd;color:#222;width:min(700px,100%);max-height:85vh;border-radius:12px;padding:18px;box-shadow:0 15px 50px rgba(0,0,0,.45)}
.modal h2{margin:0 0 12px;font-size:20px}
.genre-options{display:flex;flex-wrap:wrap;gap:7px;max-height:55vh;overflow:auto;padding:5px 2px}
.genre-option{border:1px solid #aaa;background:#f5f5f5;border-radius:999px;padding:7px 11px;cursor:pointer}
.genre-option.selected{background:#222;color:#fff;border-color:#222}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:12px;font-weight:700}
.form-field input,.form-field select{width:100%}
.check-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.check-row label{display:flex;align-items:center;gap:6px;font-size:13px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}}
@media(max-width:700px){.wrap,main{padding-left:12px;padding-right:12px}#search{min-width:100%}}
</style>
</head>
<body>
<header>
<div class="wrap">
<div class="top">
<h1>Station Manager</h1>
<div class="stats" id="stats">Loading…</div>
</div>
<div class="controls">
<input id="search" placeholder="Search stations…">
<select id="genre"><option value="">All Genres</option></select>
<select id="type"><option value="">All Types</option><option>Internet</option><option>On Air</option></select>
<select id="visibility"><option value="">All Visibility</option><option value="true">Visible</option><option value="false">Hidden</option></select>
<select id="favorite"><option value="">All Favorites</option><option value="true">Favorites</option><option value="false">Not Favorites</option></select>
<button class="export" id="addBtn" type="button">＋ Add Station</button><button class="export" id="exportBtn" type="button">Export stations.json</button>
</div>
</div>
</header>

<main>
<div class="table-wrap">
<table>
<thead><tr><th>#</th><th>Logo</th><th>Station</th><th>Favorite</th><th>Visible</th><th>Type</th><th>Genres</th><th>Stream</th><th>Website</th></tr></thead>
<tbody id="body"></tbody>
</table>
</div>
<div class="note">Edits and new stations are local to this page. Use “Export stations.json” to download the updated JSON.</div>
</main>


<div class="modal-backdrop" id="addModal">
<div class="modal">
<h2>Add Station</h2>
<div class="form-grid">
  <div class="form-field full"><label for="newName">Station Name</label><input id="newName" type="text" placeholder="Station name"></div>
  <div class="form-field full"><label for="newStream">Stream URL</label><input id="newStream" type="text" placeholder="https://..."></div>
  <div class="form-field full"><label for="newLogo">Logo Path</label><input id="newLogo" type="text" placeholder="images/station-logo.png"></div>
  <div class="form-field full"><label for="newUrl">Website</label><input id="newUrl" type="text" placeholder="https://..."></div>
  <div class="form-field"><label for="newType">Type</label><select id="newType"><option>Internet</option><option>On Air</option></select></div>
  <div class="form-field"><label>Options</label><div class="check-row"><label><input id="newFavorite" type="checkbox"> Favorite</label><label><input id="newVisible" type="checkbox" checked> Visible</label></div></div>
  <div class="form-field full"><label>Genres</label><div class="genre-options" id="newGenreOptions"></div></div>
</div>
<div class="modal-actions">
<button type="button" id="cancelAdd">Cancel</button>
<button type="button" id="createStation">Add Station</button>
</div>
</div>
</div>

<div class="modal-backdrop" id="genreModal">
<div class="modal">
<h2>Edit Genres</h2>
<div class="genre-options" id="genreOptions"></div>
<div class="modal-actions">
<button type="button" id="cancelGenres">Cancel</button>
<button type="button" id="saveGenres">Save Genres</button>
</div>
</div>
</div>

<script>
let stations=[];
let genreReference=[];
let editingGenreIndex=null;
let pendingGenres=[];
let newStationGenres=[];

const body=document.getElementById('body');
const search=document.getElementById('search');
const genre=document.getElementById('genre');
const type=document.getElementById('type');
const visibility=document.getElementById('visibility');
const favorite=document.getElementById('favorite');
const stats=document.getElementById('stats');
const genreModal=document.getElementById('genreModal');
const genreOptions=document.getElementById('genreOptions');

function esc(v){
  return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
}

function populateGenres(){
  const source=genreReference.length
    ? genreReference
    : [...new Set(stations.flatMap(s=>Array.isArray(s.genres)?s.genres:[]))];
  const gs=[...new Set(source)].sort((a,b)=>a.localeCompare(b));
  genre.innerHTML='<option value="">All Genres</option>'+gs.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
}

function toggleBool(i,key){
  stations[i][key]=stations[i][key]===true?false:true;
  render();
}

function edit(i,key,value){
  stations[i][key]=value;
}


function renderNewGenreOptions(){
  const source=genreReference.length
    ? genreReference
    : [...new Set(stations.flatMap(s=>Array.isArray(s.genres)?s.genres:[]))];
  const gs=[...new Set(source)].sort((a,b)=>a.localeCompare(b));
  const target=document.getElementById('newGenreOptions');
  target.innerHTML=gs.map(g=>{
    const selected=newStationGenres.includes(g);
    return `<button type="button" class="genre-option ${selected?'selected':''}" data-genre="${esc(g)}">${esc(g)}</button>`;
  }).join('');
  target.querySelectorAll('.genre-option').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const g=btn.dataset.genre;
      if(newStationGenres.includes(g)){
        newStationGenres=newStationGenres.filter(x=>x!==g);
      }else{
        newStationGenres.push(g);
      }
      renderNewGenreOptions();
    });
  });
}

function openAddStation(){
  document.getElementById('newName').value='';
  document.getElementById('newStream').value='';
  document.getElementById('newLogo').value='';
  document.getElementById('newUrl').value='';
  document.getElementById('newType').value='Internet';
  document.getElementById('newFavorite').checked=false;
  document.getElementById('newVisible').checked=true;
  newStationGenres=[];
  renderNewGenreOptions();
  document.getElementById('addModal').classList.add('open');
  document.getElementById('newName').focus();
}

function closeAddStation(){
  document.getElementById('addModal').classList.remove('open');
}

function createStation(){
  const name=document.getElementById('newName').value.trim();
  const stream=document.getElementById('newStream').value.trim();
  if(!name){
    alert('Please enter a station name.');
    document.getElementById('newName').focus();
    return;
  }
  if(!stream){
    alert('Please enter a stream URL.');
    document.getElementById('newStream').focus();
    return;
  }

  stations.push({
    name:name,
    stream:stream,
    url:document.getElementById('newUrl').value.trim(),
    logo:document.getElementById('newLogo').value.trim(),
    favorite:document.getElementById('newFavorite').checked,
    type:document.getElementById('newType').value,
    genres:[...newStationGenres],
    visible:document.getElementById('newVisible').checked
  });

  populateGenres();
  render();
  closeAddStation();
}

function openGenreEditor(i){
  editingGenreIndex=i;
  pendingGenres=Array.isArray(stations[i].genres)?[...stations[i].genres]:[];
  renderGenreOptions();
  genreModal.classList.add('open');
}

function renderGenreOptions(){
  const source=genreReference.length
    ? genreReference
    : [...new Set(stations.flatMap(s=>Array.isArray(s.genres)?s.genres:[]))];
  const gs=[...new Set(source)].sort((a,b)=>a.localeCompare(b));
  genreOptions.innerHTML=gs.map(g=>{
    const selected=pendingGenres.includes(g);
    return `<button type="button" class="genre-option ${selected?'selected':''}" data-genre="${esc(g)}">${esc(g)}</button>`;
  }).join('');
  genreOptions.querySelectorAll('.genre-option').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const g=btn.dataset.genre;
      if(pendingGenres.includes(g)){
        pendingGenres=pendingGenres.filter(x=>x!==g);
      }else{
        pendingGenres.push(g);
      }
      renderGenreOptions();
    });
  });
}

function closeGenreEditor(){
  editingGenreIndex=null;
  pendingGenres=[];
  genreModal.classList.remove('open');
}

function saveGenres(){
  if(editingGenreIndex!==null){
    stations[editingGenreIndex].genres=[...pendingGenres];
    render();
  }
  closeGenreEditor();
}

function render(){
  const q=search.value.trim().toLowerCase();
  const g=genre.value;
  const t=type.value;
  const v=visibility.value;
  const f=favorite.value;
  const rows=[];

  stations.forEach((s,i)=>{
    if(q&&!String(s.name||'').toLowerCase().includes(q))return;
    if(g&&!(s.genres||[]).includes(g))return;
    if(t&&s.type!==t)return;
    if(v&&String(s.visible)!==v)return;
    if(f&&String(s.favorite)!==f)return;
    rows.push([s,i]);
  });

  stats.textContent=`${rows.length} of ${stations.length} stations`;

  body.innerHTML=rows.length?rows.map(([s,i],n)=>{
    const genres=Array.isArray(s.genres)?s.genres:[];
    return `<tr>
      <td class="rownum">${n+1}</td>
      <td class="logo-cell">
        <img src="${esc(s.logo||'')}" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
        <input class="logo-path" value="${esc(s.logo||'')}" onchange="edit(${i},'logo',this.value);this.previousElementSibling.src=this.value;this.previousElementSibling.style.visibility='visible'">
      </td>
      <td class="name"><input class="cell" value="${esc(s.name)}" onchange="edit(${i},'name',this.value)"></td>
      <td class="bool"><button class="${s.favorite?'yes':'no'}" onclick="toggleBool(${i},'favorite')">${s.favorite?'★':'☆'}</button></td>
      <td class="bool"><button class="${s.visible?'yes':'no'}" onclick="toggleBool(${i},'visible')">${s.visible?'✓':'✕'}</button></td>
      <td><select class="cell" onchange="edit(${i},'type',this.value)"><option ${s.type==='Internet'?'selected':''}>Internet</option><option ${s.type==='On Air'?'selected':''}>On Air</option></select></td>
      <td class="genres">
        <div class="genre-list">
          ${genres.map(g=>`<span class="pill">${esc(g)}</span>`).join('')}
          <button class="edit-icon" type="button" title="Edit genres" aria-label="Edit genres" onclick="openGenreEditor(${i})">✎</button>
        </div>
      </td>
      <td class="url"><input class="cell" value="${esc(s.stream)}" onchange="edit(${i},'stream',this.value)"></td>
      <td class="url"><input class="cell" value="${esc(s.url)}" onchange="edit(${i},'url',this.value)"></td>
    </tr>`;
  }).join(''):`<tr><td colspan="9" class="empty">No stations match your filters.</td></tr>`;
}

[search,genre,type,visibility,favorite].forEach(el=>{
  el.addEventListener(el===search?'input':'change',render);
});


document.getElementById('addBtn').addEventListener('click',openAddStation);
document.getElementById('cancelAdd').addEventListener('click',closeAddStation);
document.getElementById('createStation').addEventListener('click',createStation);
document.getElementById('addModal').addEventListener('click',e=>{
  if(e.target===document.getElementById('addModal'))closeAddStation();
});

document.getElementById('cancelGenres').addEventListener('click',closeGenreEditor);
document.getElementById('saveGenres').addEventListener('click',saveGenres);
genreModal.addEventListener('click',e=>{
  if(e.target===genreModal)closeGenreEditor();
});

document.getElementById('exportBtn').addEventListener('click',()=>{
  const output={
    genreReference: genreReference,
    stations: stations
  };
  const blob=new Blob([JSON.stringify(output,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='stations.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});

async function load(){
  try{
    const r=await fetch('stations.json',{cache:'no-store'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    if(!Array.isArray(d.stations))throw new Error('Invalid stations array');
    stations=d.stations;
    genreReference=Array.isArray(d.genreReference)?d.genreReference:[];
    populateGenres();
    render();
  }catch(e){
    stats.textContent='Unable to load stations.json';
    body.innerHTML='<tr><td colspan="9" class="empty">Unable to load stations.json.<br>Make sure station-manager.html is in the same directory as stations.json.</td></tr>';
  }
}
load();
</script>
</body>
</html>
