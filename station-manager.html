<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Station Manager</title><style>
:root{--bg:#111;--panel:#c0c0c0;--ink:#222;--line:#aaa;--accent:#808080}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:5;background:#222;border-bottom:1px solid #444}.wrap{max-width:1500px;margin:auto;padding:18px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{margin:0;font-size:27px}.stats{font-size:14px;color:#ccc}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px}input,select{background:#fff;color:#222}#search{min-width:280px;flex:1}button{cursor:pointer;background:#fff;color:#222}main{max-width:1500px;margin:auto;padding:18px 22px 60px}.table-wrap{overflow:auto;background:var(--panel);border-radius:10px;border:1px solid #888}table{width:100%;border-collapse:collapse;color:var(--ink);font-size:13px;min-width:1150px}thead{position:sticky;top:0;background:#ddd;z-index:2}th,td{border-bottom:1px solid #aaa;padding:7px 8px;text-align:left;vertical-align:middle}th{font-weight:700;white-space:nowrap}tbody tr:nth-child(even){background:#d5d5d5}tbody tr:hover{background:#eee}.name{font-weight:700;min-width:190px}.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:5px}.cell:focus{background:#fff;border-color:#888;outline:none}.logo-cell{width:50px;text-align:center}.logo-cell img{width:36px;height:36px;object-fit:contain;border-radius:5px;background:#eee}.bool{font-size:19px;text-align:center;width:75px}.bool button{border:0;background:transparent;font-size:19px;padding:2px 7px}.bool button.yes{color:#16833b}.bool button.no{color:#a33}.genres{min-width:180px}.url{min-width:280px}.rownum{color:#777;width:45px;text-align:center}.note{color:#bbb;font-size:12px;margin-top:10px}.empty{padding:60px;text-align:center;color:#666}@media(max-width:700px){.wrap,main{padding-left:12px;padding-right:12px}#search{min-width:100%}}
</style></head><body><header><div class="wrap"><div class="top"><h1>Station Manager</h1><div class="stats" id="stats">Loading…</div></div><div class="controls"><input id="search" placeholder="Search stations…"><select id="genre"><option value="">All Genres</option></select><select id="type"><option value="">All Types</option><option>Internet</option><option>On Air</option></select><select id="visibility"><option value="">All Visibility</option><option value="true">Visible</option><option value="false">Hidden</option></select><select id="favorite"><option value="">All Favorites</option><option value="true">Favorites</option><option value="false">Not Favorites</option></select></div></div></header><main><div class="table-wrap"><table><thead><tr><th>#</th><th>Logo</th><th>Station</th><th>Favorite</th><th>Visible</th><th>Type</th><th>Genres</th><th>Stream</th><th>Website</th></tr></thead><tbody id="body"></tbody></table></div><div class="note">Prototype only — edits are local to this page and are not written back to stations.json yet.</div></main><script>
let stations=[];const body=document.getElementById('body'),search=document.getElementById('search'),genre=document.getElementById('genre'),type=document.getElementById('type'),visibility=document.getElementById('visibility'),favorite=document.getElementById('favorite'),stats=document.getElementById('stats');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function populateGenres(){const gs=[...new Set(stations.flatMap(s=>Array.isArray(s.genres)?s.genres:[]))].sort((a,b)=>a.localeCompare(b));genre.innerHTML='<option value="">All Genres</option>'+gs.map(g=>`<option>${esc(g)}</option>`).join('')}function toggleBool(i,key){stations[i][key]=stations[i][key]===true?false:true;render()}function edit(i,key,value){stations[i][key]=value}function render(){const q=search.value.trim().toLowerCase(),g=genre.value,t=type.value,v=visibility.value,f=favorite.value,rows=[];stations.forEach((s,i)=>{if(q&&!s.name.toLowerCase().includes(q))return;if(g&&!(s.genres||[]).includes(g))return;if(t&&s.type!==t)return;if(v&&String(s.visible)!==v)return;if(f&&String(s.favorite)!==f)return;rows.push([s,i])});stats.textContent=`${rows.length} of ${stations.length} stations`;body.innerHTML=rows.length?rows.map(([s,i],n)=>`<tr><td class="rownum">${n+1}</td><td class="logo-cell">${s.logo?`<img src="${esc(s.logo)}" alt="">`:''}</td><td class="name"><input class="cell" value="${esc(s.name)}" onchange="edit(${i},'name',this.value)"></td><td class="bool"><button class="${s.favorite?'yes':'no'}" onclick="toggleBool(${i},'favorite')">${s.favorite?'★':'☆'}</button></td><td class="bool"><button class="${s.visible?'yes':'no'}" onclick="toggleBool(${i},'visible')">${s.visible?'✓':'✕'}</button></td><td><select class="cell" onchange="edit(${i},'type',this.value)"><option ${s.type==='Internet'?'selected':''}>Internet</option><option ${s.type==='On Air'?'selected':''}>On Air</option></select></td><td class="genres"><input class="cell" value="${esc((s.genres||[]).join(', '))}" onchange="edit(${i},'genres',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></td><td class="url"><input class="cell" value="${esc(s.stream)}" onchange="edit(${i},'stream',this.value)"></td><td class="url"><input class="cell" value="${esc(s.url)}" onchange="edit(${i},'url',this.value)"></td></tr>`).join(''):`<tr><td colspan="9" class="empty">No stations match your filters.</td></tr>`}[search,genre,type,visibility,favorite].forEach(el=>el.addEventListener(el===search?'input':'change',render));
async function load(){try{const r=await fetch('stations.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();if(!Array.isArray(d.stations))throw new Error('Invalid stations array');stations=d.stations;populateGenres();render()}catch(e){stats.textContent='Unable to load stations.json';body.innerHTML='<tr><td colspan="9" class="empty">Unable to load stations.json.<br>Make sure station-manager.html is in the same directory as stations.json.</td></tr>'}}load();
</script></body></html>
